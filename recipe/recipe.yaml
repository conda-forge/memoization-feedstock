schema_version: 1

context:
  name: memoization
  version: "0.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/memoization-${{ version }}.tar.gz
  sha256: fde5e7cd060ef45b135e0310cfec17b2029dc472ccb5bbbbb42a503d4538a135

build:
  number: 3
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }},<4.0

tests:
  - python:
      imports:
        - memoization
        - memoization.backport
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: A powerful caching library for Python, with TTL support and multiple algorithm options. (https://github.com/lonelyenvoy/python-memoization)
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/lonelyenvoy/python-memoization

extra:
  recipe-maintainers:
    - pkgw
    - jan-janssen
